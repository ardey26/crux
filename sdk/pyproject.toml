[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crux-sdk"
version = "0.1.1"
description = "Python SDK for Crux -- agentic knowledge versioning"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Crux Authors"},
]
keywords = ["ai", "agents", "belief-graph", "world-model", "knowledge-versioning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
readme = "README.md"
dependencies = ["msgpack>=1.0"]

[project.urls]
Homepage = "https://github.com/ardey26/crux"
Repository = "https://github.com/ardey26/crux"

[project.scripts]
crux-observe = "crux.cli:main"

[tool.setuptools.packages.find]
include = ["crux*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
